# --------------------------------------------------
# Bringup sample: GPIO shell for PCB testing
# --------------------------------------------------

# GPIO and GPIO shell commands (gpio conf, gpio set, gpio get, ...)
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y

# Shell subsystem
CONFIG_SHELL=y

# USB CDC ACM console (XIAO nRF52840 uses native USB for serial)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y

# Logging
CONFIG_LOG=y
