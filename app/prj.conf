# --------------------------------------------------
# 2DOF Tilt Platform — Application Firmware
# --------------------------------------------------

# Shell subsystem
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# USB CDC ACM console
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# GPIO
CONFIG_GPIO=y

# Stepper motor control
CONFIG_STEPPER=y
CONFIG_STEPPER_SHELL=y
CONFIG_STEPPER_CTRL_ISR_SAFE_EVENTS=y

# IMU (external SparkFun LSM6DSO on i2c1)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSO=y

# Inter-component messaging
CONFIG_ZBUS=y

# Persistent IMU calibration (settings over NVS on the storage_partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Floating-point printing for IMU shell output
CONFIG_CBPRINTF_FP_SUPPORT=y

# Logging
CONFIG_LOG=y

# Reboot support (used by 'platform dfu' command)
CONFIG_REBOOT=y
